name: Build SimpleMTKClient

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List Schemes and Build App
        run: |
          XCODEPROJ=$(ls -d *.xcodeproj | head -n 1)
          echo "=== AVAILABLE SCHEMES ==="
          xcodebuild -project "$XCODEPROJ" -list
          
          echo "=== BUILDING ALL TARGETS ==="
          xcodebuild -project "$XCODEPROJ" \
            -alltargets \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build_out" \
            build

      - name: Locate and Zip App Bundle
        run: |
          cd "$GITHUB_WORKSPACE/build_out"
          # Find the compiled .app bundle dynamically no matter its name
          APP_NAME=$(ls -d *.app | head -n 1)
          echo "Found app: $APP_NAME"
          zip -r SimpleMTKClient-Compiled.zip "$APP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMTKClient-App
          path: build_out/SimpleMTKClient-Compiled.zip
