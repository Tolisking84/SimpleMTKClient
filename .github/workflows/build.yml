name: Build SimpleMTKClient
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and schemes
        run: |
          xcodebuild -version
          xcodebuild -project SimpleMTK.xcodeproj -list
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project SimpleMTK.xcodeproj -scheme SimpleMTK \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: grep -E "error:|fatal" build.log | head -40 || true
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Zip app
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "SimpleMTK.app")
          ditto -c -k --keepParent "$APP" SimpleMTK.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleMTK-App
          path: SimpleMTK.zip
